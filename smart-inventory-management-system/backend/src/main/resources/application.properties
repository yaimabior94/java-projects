# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:smart_inventory_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
# FIX BUG-16: H2 console disabled for security. Enable only during local development
# by setting spring.h2.console.enabled=true in a dev-profile (application-dev.properties).
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configurations (key must be at least 256 bits / 32 bytes for HS256)
jwt.secret=smart-inventory-secret-key-12345678901234567890123456789012
jwt.expiration=86400000

# Server Port
server.port=8080

# Logging Settings
logging.level.org.springframework.web=INFO
logging.level.com.smartinventory=DEBUG
