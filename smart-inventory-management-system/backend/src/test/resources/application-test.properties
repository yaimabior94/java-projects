# Test Configuration - H2 In-Memory Database
# This configuration is used for running tests with @DataJpaTest and @SpringBootTest

# ============================================
# H2 DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console for debugging (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
# Database platform for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create/drop schema on startup/shutdown
# create-drop: Create schema on startup, drop on shutdown (ideal for tests)
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in console (set to true for debugging)
spring.jpa.show-sql=false

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# Disable batching for easier debugging
spring.jpa.properties.hibernate.jdbc.batch_size=1

# Generate proper sequences for ID generation
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# ============================================
# LOGGING CONFIGURATION
# ============================================
# Application logs at DEBUG level during testing
logging.level.com.smartinventory=DEBUG

# Spring Data JPA logs
logging.level.org.springframework.data=INFO

# Spring Security logs
logging.level.org.springframework.security=INFO

# Hibernate logs (set to DEBUG to see SQL and binding parameters)
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Reduce noise from other libraries
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO

